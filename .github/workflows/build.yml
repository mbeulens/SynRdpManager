name: build

on:
  push:
    branches: ['**']
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test -c Release

      - name: Publish
        run: dotnet publish src/SynRdpManager.App -c Release -o out

      - name: Package
        shell: pwsh
        run: |
          $v = (Get-Content VERSION).Trim()
          if (-not (Test-Path settings.sample.json)) { throw 'settings.sample.json is missing' }
          if (-not (Test-Path out/SynRdpManager.exe)) { throw 'out/SynRdpManager.exe is missing' }
          $files = @('out/SynRdpManager.exe', 'settings.sample.json')
          Compress-Archive -Path $files -DestinationPath "SynRdpManager-$v.zip"
          "ZIP=SynRdpManager-$v.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@v4
        with:
          name: SynRdpManager
          path: ${{ env.ZIP }}
          if-no-files-found: warn

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP }}
